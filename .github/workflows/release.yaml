name: Release Charts

on:
  push:
    branches:
      - main

permissions: {}
jobs:
  release:
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access
      id-token: write # OIDC token used by get-vault-secrets to authenticate to Vault

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.12.0

      - name: Add dependency chart repos
        run: |
          helm repo add elastic https://helm.elastic.co
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add minio-new https://charts.min.io

      - name: Fetch GPG signing key from Vault
        uses: grafana/shared-workflows/actions/get-vault-secrets@28361cdb22223e5f1e34358c86c20908e7248760 # v1.1.0
        with:
          repo_secrets: |
            GPG_PRIVATE_KEY=helm-chart-signing-key:private_key
            GPG_PASSPHRASE=helm-chart-signing-key:passphrase
            GPG_KEY_NAME=helm-chart-signing-key:key_name

      - name: Import GPG signing key
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.gnupg"
          chmod 0700 "${HOME}/.gnupg"
          printf 'use-agent\npinentry-mode loopback\n' > "${HOME}/.gnupg/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "${HOME}/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --yes --import

          # chart-releaser signs via Helm's provenance signer, which reads the
          # private key from a legacy-format secret keyring. Modern GnuPG no
          # longer keeps one, so export it explicitly.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --export-secret-keys "${GPG_KEY_NAME}" > "${HOME}/.gnupg/secring.gpg"

          # Passphrase in a file for chart-releaser's --passphrase-file flag.
          umask 077
          printf '%s' "${GPG_PASSPHRASE}" > "${HOME}/.gnupg/cr-passphrase"

          # Tell chart-releaser to sign. cr reads CR_* env vars (same mechanism
          # as CR_TOKEN below): sign -> CR_SIGN, key -> CR_KEY, etc.
          {
            echo "CR_SIGN=true"
            echo "CR_KEY=${GPG_KEY_NAME}"
            echo "CR_KEYRING=${HOME}/.gnupg/secring.gpg"
            echo "CR_PASSPHRASE_FILE=${HOME}/.gnupg/cr-passphrase"
          } >> "${GITHUB_ENV}"

      # chart-releaser packages, signs (CR_SIGN above), creates the GitHub
      # release, and uploads both the .tgz and its .prov. The .prov also lands
      # in .cr-release-packages/ next to the .tgz, so the GHCR push below
      # uploads provenance automatically.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm-charts"
          done
